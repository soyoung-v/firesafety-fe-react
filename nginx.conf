# firesafety-fe-react 컨테이너 내부 nginx 설정.
# 이 파일은 ArcGuard 배포 구성의 edge nginx(firesafety-be 레포의 deploy/nginx, /api·/ws 라우팅 담당)와는
# 별개로, 이 컨테이너 안에서 React 정적 빌드 파일을 서빙하고 SPA 라우팅만 폴백 처리하는 용도다.
# 이 파일에서 /api, /ws를 프록시하지 않는다 — 그건 edge nginx의 책임이다.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router history 모드 대응 — 존재하지 않는 경로는 index.html로 폴백(새로고침 시 딥링크 접근용)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
